<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Bella Vitta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Allura&family=Figtree:wght@400;500;600;700&display=swap">
<style>
  /* Layout: bio em coluna única. Capa com foto que se dissolve no fundo, logo sobreposto, cards de banner com foto à esquerda e botão em pílula à direita. Páginas internas: Sobre, Quiz, Catálogo e ADM. */
  :root {
    --bg: #FFFFFF;
    --bg2: #F6D7C3;
    --surface: #FFFFFF;
    --ink: #2E1510;
    --muted: #7B5646;
    --line: #F0DFD3;
    --accent: #C4551E;
    --accent-ink: #FFFFFF;
    --soft: #FCEFE6;
    --deep: #3A1A12;
    --danger: #B42318;
    --font-display: 'Playfair Display', Georgia, 'Times New Roman', serif;
    --font-script: 'Allura', 'Brush Script MT', cursive;
    --font-body: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1C0E09; --bg2: #2A140C; --surface: #2C1710; --ink: #FBE9DE; --muted: #CFA58F;
      --line: #4A2A1E; --accent: #E8814B; --accent-ink: #2A120A; --soft: #3A1E13; --deep: #120804; --danger: #FF8A7A;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1C0E09; --bg2: #2A140C; --surface: #2C1710; --ink: #FBE9DE; --muted: #CFA58F;
    --line: #4A2A1E; --accent: #E8814B; --accent-ink: #2A120A; --soft: #3A1E13; --deep: #120804; --danger: #FF8A7A;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background-color: var(--bg);
    background-image: linear-gradient(180deg, var(--bg2) 0px, var(--bg) 560px);
    background-repeat: no-repeat;
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    padding-block: 12px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    min-height: 100vh;
  }
  main { max-width: 440px; margin: 0 auto; min-width: 0; }
  h1, h2, h3, p { margin: 0; }
  h1, h2, h3 { font-family: var(--font-display); font-weight: 600; text-wrap: balance; letter-spacing: -0.005em; }
  em { font-style: italic; color: var(--accent); font-weight: 500; }
  a { color: inherit; }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 8px; }
  [tabindex="-1"]:focus { outline: none; }

  .view { animation: in .28s ease both; display: flex; flex-direction: column; gap: 22px; }
  @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .view { animation: none; } .quiz-go { animation: none; } * { transition: none !important; } }

  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; }
  .back { background: none; border: 0; padding: 8px 0; text-decoration: none; font-size: 14px; font-weight: 600; color: var(--muted); }
  .back:hover { color: var(--accent); }
  .adm {
    margin-left: auto; display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
    font-size: 12px; font-weight: 700; letter-spacing: .08em; padding: 6px 12px; border-radius: 99px;
    color: var(--muted); border: 1.5px solid var(--line); background: var(--surface);
  }
  .adm:hover { color: var(--accent); border-color: var(--accent); }
  .adm svg { width: 13px; height: 13px; }
  .adm.over { position: absolute; top: 12px; right: 12px; z-index: 3; color: #fff; border: 0; background: rgba(30, 12, 8, .55); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  .adm.over:hover { color: #fff; background: rgba(30, 12, 8, .8); }

  /* Capa */
  .hero { position: relative; display: flex; flex-direction: column; gap: 0; }
  .hero-img {
    aspect-ratio: 760 / 600; width: 100%; border-radius: 24px 24px 0 0;
    background-size: cover; background-position: center top; background-color: var(--soft);
    -webkit-mask-image: linear-gradient(#000 52%, transparent 100%); mask-image: linear-gradient(#000 52%, transparent 100%);
  }
  .brand { margin-top: -44px; position: relative; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-inline: 8px; }
  .logo { width: 84px; height: 64px; color: var(--accent); }
  .brand h1 { font-size: 52px; line-height: 1; color: var(--ink); }
  .seg { font-size: 12px; font-weight: 600; letter-spacing: .38em; text-transform: uppercase; color: var(--ink); display: flex; align-items: center; gap: 10px; }
  .seg::before, .seg::after { content: ""; width: 26px; height: 1px; background: var(--ink); opacity: .6; }
  .script { font-family: var(--font-script); font-size: 34px; line-height: 1.1; color: var(--accent); margin-top: 6px; }
  .cards { display: flex; flex-direction: column; gap: 14px; }

  /* Cards de banner */
  .bn {
    position: relative; display: block; min-height: 150px; border-radius: 20px; overflow: hidden; text-decoration: none; color: #fff;
    background: var(--deep); box-shadow: 0 10px 24px rgba(58, 26, 18, .22); transition: transform .15s ease;
  }
  .bn:hover { transform: translateY(-2px); }
  .bn::before { content: ""; position: absolute; inset: 0; background-image: var(--img); background-size: cover; background-position: var(--pos, center 15%); }
  .bn::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(30, 12, 8, .0) 0%, rgba(30, 12, 8, .55) 42%, rgba(30, 12, 8, .94) 100%); }
  .bn-in { position: relative; z-index: 1; margin-left: auto; width: 62%; min-height: 150px; padding: 16px 18px 16px 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; }
  .bn-t { font-family: var(--font-display); font-size: 21px; line-height: 1.15; font-weight: 600; text-wrap: balance; }
  .bn-s { font-size: 13px; opacity: .85; }
  .pill {
    display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
    padding: 10px 18px; border-radius: 99px; color: #fff; background: linear-gradient(90deg, #C4551E, #E27B3E);
    box-shadow: 0 4px 14px rgba(196, 85, 30, .45);
  }
  .pill.wa { background: linear-gradient(90deg, #2E9E5B, #55BE80); box-shadow: 0 4px 14px rgba(46, 158, 91, .4); }
  .bn.plain { min-height: 0; background: linear-gradient(135deg, var(--deep), #5C2C1B); }
  .bn.plain::before, .bn.plain::after { display: none; }
  .bn.plain .bn-in { width: 100%; min-height: 0; padding: 20px 18px; }
  .bn-in .bn-t, .bn-in .bn-s { overflow-wrap: anywhere; }
  .bn.mini { min-height: 88px; border-radius: 16px; box-shadow: 0 6px 16px rgba(58, 26, 18, .18); }
  .bn.mini .bn-in { min-height: 88px; padding: 12px 14px 12px 0; gap: 6px; }
  .bn.mini .bn-t { font-size: 17px; }
  .bn.mini .bn-s { font-size: 12px; }
  .bn.mini .pill { font-size: 11px; padding: 7px 14px; }
  .bn.plain .bn-in { padding: 14px 16px; }

  /* Destaque do quiz */
  .quiz-card {
    position: relative; display: flex; flex-direction: column; justify-content: flex-end; min-height: 280px; border-radius: 24px; overflow: hidden;
    text-decoration: none; color: #fff; background: var(--deep); border: 1.5px solid rgba(232, 129, 75, .7);
    box-shadow: 0 16px 34px rgba(58, 26, 18, .34); transition: transform .15s ease;
  }
  .quiz-card:hover { transform: translateY(-2px); }
  .quiz-card::before { content: ""; position: absolute; inset: 0; background-image: var(--img); background-size: cover; background-position: center 16%; }
  .quiz-card::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(30, 12, 8, .08) 0%, rgba(30, 12, 8, .30) 36%, rgba(30, 12, 8, .94) 100%); }
  .quiz-in { position: relative; z-index: 1; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
  .quiz-tag { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; padding: 6px 12px; border-radius: 99px; background: rgba(255, 247, 241, .94); color: #8E3A12; }
  .quiz-tag svg { width: 13px; height: 13px; }
  .quiz-t { font-family: var(--font-display); font-size: 32px; line-height: 1.08; font-weight: 600; text-wrap: balance; }
  .quiz-t em { color: #F2A672; }
  .quiz-s { font-size: 15px; max-width: 32ch; opacity: .93; }
  .quiz-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; font-weight: 600; opacity: .85; }
  .quiz-go {
    display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 4px; padding: 15px 18px; border-radius: 14px;
    font-weight: 700; font-size: 16px; color: #fff; background: linear-gradient(90deg, #C4551E, #E27B3E);
    animation: pulso 2.6s ease-in-out infinite;
  }
  .quiz-go svg { width: 20px; height: 20px; }
  @keyframes pulso {
    0%, 100% { box-shadow: 0 6px 20px rgba(196, 85, 30, .45), 0 0 0 0 rgba(226, 123, 62, .55); }
    50% { box-shadow: 0 6px 20px rgba(196, 85, 30, .45), 0 0 0 9px rgba(226, 123, 62, 0); }
  }

  .sec-t { font-size: 24px; }
  .cats { display: flex; gap: 10px; overflow-x: auto; padding: 2px; margin: -2px; scrollbar-width: none; }
  .cats::-webkit-scrollbar { display: none; }
  .cat { flex: none; width: 118px; aspect-ratio: 3 / 4; border-radius: 16px; background-size: cover; background-position: center top; background-image: var(--img); background-color: var(--soft); position: relative; text-decoration: none; }
  .cat span { position: absolute; left: 8px; right: 8px; bottom: 8px; text-align: center; font-size: 13px; font-weight: 600; padding: 6px 4px; border-radius: 99px; background: rgba(255, 247, 241, .92); color: #2E1510; }
  .info { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 6px 18px rgba(58, 26, 18, .06); }
  .info-b { display: flex; flex-direction: column; gap: 10px; }
  .info-h { display: flex; align-items: center; gap: 10px; }
  .info-h svg { width: 22px; height: 22px; color: var(--accent); flex: none; }
  .info-h h3 { font-size: 21px; }
  .info-hr { display: flex; flex-direction: column; margin: 0; padding: 0; list-style: none; }
  .info-hr li { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 12px; padding: 9px 0; border-bottom: 1px dashed var(--line); font-size: 15px; }
  .info-hr li:last-child { border-bottom: 0; }
  .info-hr span:last-child { font-weight: 600; font-variant-numeric: tabular-nums; }
  .info-sep { height: 1px; background: var(--line); }
  .info-end { overflow-wrap: anywhere; }
  .map-btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 13px 18px; border-radius: 14px; font-weight: 700; text-decoration: none; border: 1.5px solid var(--accent); color: var(--accent); background: transparent; }
  .map-btn:hover { background: var(--accent); color: var(--accent-ink); }
  .map-btn svg { width: 18px; height: 18px; }
  /* Landing page (Sobre) */
  .lp-hero { position: relative; border-radius: 24px; overflow: hidden; min-height: 440px; display: flex; flex-direction: column; justify-content: flex-end; color: #fff; background: var(--deep); }
  .lp-hero::before { content: ""; position: absolute; inset: 0; background-image: var(--img); background-size: cover; background-position: center 8%; }
  .lp-hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(30, 12, 8, .04) 22%, rgba(30, 12, 8, .55) 58%, rgba(30, 12, 8, .94) 100%); }
  .lp-in { position: relative; z-index: 1; padding: 22px; display: flex; flex-direction: column; gap: 12px; }
  .lp-eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; opacity: .92; display: flex; align-items: center; gap: 10px; }
  .lp-eyebrow::before { content: ""; width: 24px; height: 1px; background: currentColor; }
  .lp-h { font-family: var(--font-display); font-size: 38px; line-height: 1.05; font-weight: 600; text-wrap: balance; }
  .lp-h em { color: #F2A672; }
  .lp-sub { font-size: 16px; opacity: .93; max-width: 34ch; }
  .lp-btns { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
  .btn.light { background: rgba(255, 255, 255, .14); border-color: rgba(255, 255, 255, .75); color: #fff; -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
  .lp-k { font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
  .lp-t { font-family: var(--font-display); font-size: 28px; line-height: 1.12; font-weight: 600; text-wrap: balance; }
  .lp-head { display: flex; flex-direction: column; gap: 6px; }
  .trust { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .tr { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; box-shadow: 0 6px 18px rgba(58, 26, 18, .06); }
  .tr:last-child:nth-child(odd) { grid-column: 1 / -1; }
  .tr-i { width: 42px; height: 42px; border-radius: 13px; background: var(--soft); color: var(--accent); display: grid; place-items: center; }
  .tr-i svg { width: 22px; height: 22px; }
  .tr b { font-family: var(--font-display); font-size: 17px; font-weight: 600; line-height: 1.2; }
  .tr span { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .lp-quote { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 22px; display: flex; flex-direction: column; gap: 14px; }
  .lp-quote .q { font-family: var(--font-display); font-size: 22px; line-height: 1.3; font-weight: 500; text-wrap: pretty; overflow-wrap: anywhere; }
  .lp-quote .q::before { content: "\201C"; display: block; font-size: 58px; line-height: .6; color: var(--accent); margin-bottom: 6px; }
  details > summary { list-style: none; cursor: pointer; }
  details > summary::-webkit-details-marker { display: none; }
  .more summary { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; color: var(--accent); padding: 8px 0; }
  .more summary::after { content: "+"; font-size: 18px; line-height: 1; }
  .more[open] summary::after { content: "\2212"; }
  .more[open] summary .t-abrir, .more:not([open]) summary .t-fechar { display: none; }
  .more-b { display: flex; flex-direction: column; gap: 10px; color: var(--muted); }
  .stp { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; counter-reset: s; }
  .stp li { counter-increment: s; position: relative; display: grid; grid-template-columns: 36px 1fr; gap: 14px; padding-bottom: 20px; align-items: start; }
  .stp li:last-child { padding-bottom: 0; }
  .stp li::before { content: counter(s); width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 700; position: relative; z-index: 1; }
  .stp li:not(:last-child)::after { content: ""; position: absolute; left: 17px; top: 36px; bottom: 0; width: 2px; background: color-mix(in srgb, var(--accent) 30%, var(--surface)); }
  .stp li span { padding-top: 6px; font-size: 16px; font-weight: 600; overflow-wrap: anywhere; }
  .mos { display: grid; grid-template-columns: 1.15fr 1fr 1fr; grid-template-rows: 150px 150px; gap: 8px; }
  .mos a { position: relative; border-radius: 16px; background-size: cover; background-position: center 12%; background-image: var(--img); background-color: var(--soft); text-decoration: none; min-width: 0; }
  .mos a:first-child { grid-row: 1 / 3; }
  .mos a span { position: absolute; left: 6px; right: 6px; bottom: 8px; text-align: center; font-size: 12px; font-weight: 700; padding: 5px 4px; border-radius: 99px; background: rgba(255, 247, 241, .93); color: #2E1510; }
  .acc { display: flex; flex-direction: column; gap: 10px; }
  .acc details { border: 1px solid var(--line); border-radius: 16px; background: var(--surface); }
  .acc summary { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 15px 18px; font-weight: 700; }
  .acc summary::after { content: "+"; font-size: 22px; line-height: 1; color: var(--accent); }
  .acc details[open] summary::after { content: "\2212"; }
  .acc-b { padding: 0 18px 18px; display: flex; flex-direction: column; gap: 12px; }
  .acc-b p { color: var(--muted); overflow-wrap: anywhere; }
  .barra {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; border-top: 1px solid var(--line);
    background: color-mix(in srgb, var(--surface) 94%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  }
  .barra-in { max-width: 440px; margin: 0 auto; display: grid; grid-template-columns: 1.35fr 1fr; gap: 10px; }
  .barra .btn { padding: 13px 10px; font-size: 15px; }
  body.has-barra { padding-bottom: 96px; }
  .foot { font-size: 12px; color: var(--muted); text-align: center; padding-top: 6px; }
  .empty { color: var(--muted); text-align: center; padding: 30px 0; }
  .block { display: flex; flex-direction: column; gap: 12px; }

  /* Página Sobre */
  .page-h { font-size: 34px; line-height: 1.05; }
  .sec { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .sec h3 { font-size: 24px; }
  .sec p { color: var(--ink); overflow-wrap: anywhere; }
  .steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; counter-reset: s; }
  .steps li { counter-increment: s; display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: start; }
  .steps li::before { content: counter(s); width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 700; font-size: 14px; }
  .steps li span { padding-top: 3px; overflow-wrap: anywhere; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { font-size: 13px; font-weight: 600; padding: 7px 13px; border-radius: 99px; background: var(--soft); color: var(--ink); }
  .difs { display: flex; flex-direction: column; gap: 12px; margin: 0; padding: 0; list-style: none; }
  .difs li { display: flex; flex-direction: column; gap: 2px; padding-left: 14px; border-left: 3px solid var(--accent); overflow-wrap: anywhere; }
  .difs b { font-family: var(--font-display); font-size: 18px; font-weight: 600; }
  .difs span { color: var(--muted); font-size: 15px; }
  .hrs { display: flex; flex-direction: column; margin: 0; padding: 0; list-style: none; }
  .hrs li { padding: 10px 0; border-bottom: 1px dashed var(--line); overflow-wrap: anywhere; }
  .hrs li:last-child { border-bottom: 0; }
  .nota { font-size: 14px; color: var(--muted); }
  .essencia { background: linear-gradient(135deg, var(--deep), #5C2C1B); color: #FBE9DE; border-radius: 20px; padding: 26px 22px; text-align: center; display: flex; flex-direction: column; gap: 12px; }
  .essencia h3 { font-size: 24px; color: #FBE9DE; }
  .essencia p { font-size: 16px; overflow-wrap: anywhere; }
  .essencia .script { color: #F2A672; font-size: 30px; margin: 4px 0 0; }

  /* Quiz */
  .progress { display: flex; flex-direction: column; gap: 8px; }
  .progress-label { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
  .bar { height: 6px; background: var(--soft); border-radius: 99px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s ease; }
  .q-title { font-size: 29px; line-height: 1.15; }
  .opts { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px;
    padding: 15px 16px; text-align: left; width: 100%;
    display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px;
    transition: border-color .15s ease, background .15s ease, transform .15s ease;
  }
  .opt:hover { border-color: var(--accent); }
  .opt:active { transform: scale(.99); }
  .opt.on { border-color: var(--accent); background: var(--soft); }
  .opt-t { font-weight: 600; display: block; }
  .opt-s { font-size: 13px; color: var(--muted); display: block; }
  .dots { display: flex; }
  .dots i { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--surface); margin-left: -6px; box-shadow: 0 0 0 1px var(--line); }

  /* Resultado */
  .res-kicker { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .res-title { font-size: 32px; line-height: 1.12; }
  .res-text { color: var(--muted); }

function reduzirFoto(file, max, limite, ar) {
  return new Promise((ok, falha) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      let sx = 0, sy = 0, sw = img.width, sh = img.height;
      if (ar) { /* corta no centro para a proporção do espaço (largura / altura) */
        if (sw / sh > ar) { sw = Math.round(sh * ar); sx = Math.round((img.width - sw) / 2); }
        else { sh = Math.round(sw / ar); sy = Math.round((img.height - sh) / 2); }
      }
      const k = Math.min(1, max / Math.max(sw, sh));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(sw * k));
      c.height = Math.max(1, Math.round(sh * k));
      c.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      let q = 0.8, d = c.toDataURL('image/jpeg', q);
      while (d.length > limite && q > 0.4) { q -= 0.1; d = c.toDataURL('image/jpeg', q); }
      ok(d);
    };
    img.onerror = () => { URL.revokeObjectURL(url); falha(new Error('imagem')); };
    img.src = url;
  });
}

    if (d && Array.isArray(d.produtos)) produtos = d.produtos;
    if (d && d.fotos && typeof d.fotos === 'object') fotosMap = d.fotos;
  } catch (e) {}
}
function salvarLocal() {
  try { localStorage.setItem(LS, JSON.stringify({ cfg, produtos, fotos: fotosMap })); return true; }
  catch (e) { return false; }
}
function recalcular() {
  produtos = (cfg.iniciado ? prodsDb : DEFAULT_PRODS).slice().sort((a, b) => (a.ordem || 0) - (b.ordem || 0));
  if (state.result) state.result = calcular(state.resp);
  refrescar();
}
async function iniciarArmazenamento() {
  let db = null;
  try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch (e) { db = null; }
  if (!db) { carregarLocal(); carregando = false; rotear(); return; }
  store.db = db;
  const limite = setTimeout(() => { if (carregando) { carregando = false; refrescar(); } }, 8000);
  const erro = () => { clearTimeout(limite); if (carregando) { carregando = false; refrescar(); } };
  db.doc('config/site').onSnapshot(s => {
    clearTimeout(limite);
    cfg = s.exists ? { ...DEFAULT_CFG, ...s.data() } : JSON.parse(JSON.stringify(DEFAULT_CFG));
    semeado = !!cfg.iniciado;
    carregando = false;
    recalcular();
  }, erro);
  db.collection('fotos').onSnapshot(s => {
    const m = {};
    s.docs.forEach(d => { const v = d.data() || {}; if (v.data) m[d.id] = v.data; });
    fotosMap = m;
    refrescar();
  }, erro);
  db.collection('produtos').onSnapshot(s => {
    prodsDb = s.docs.map(d => ({ ...d.data(), id: d.id }));
    recalcular();
  }, erro);
}
async function semear() {
  if (!store.db || semeado) return;
  for (const p of DEFAULT_PRODS) await store.db.doc('produtos/' + p.id).set(p);
  await store.db.doc('config/site').set({ ...cfg, iniciado: true });
  semeado = true;
}
async function gravarFotoDoc(k, data) {
  if (store.db) {
    if (data) await store.db.doc('fotos/' + k).set({ data }); else await store.db.doc('fotos/' + k).delete();
    const m = { ...fotosMap }; if (data) m[k] = data; else delete m[k]; fotosMap = m;
    return;
  }
  const antes = fotosMap, m = { ...fotosMap };
  if (data) m[k] = data; else delete m[k];
  fotosMap = m;
  if (!salvarLocal()) { fotosMap = antes; throw new Error('local'); }
}
async function gravarProduto(p) {
  if (store.db) { await semear(); await store.db.doc('produtos/' + p.id).set(p); return; }
  const i = produtos.findIndex(x => x.id === p.id);
  const novo = produtos.slice();
  if (i >= 0) novo[i] = p; else novo.push(p);
  const antes = produtos; produtos = novo;
  if (!salvarLocal()) { produtos = antes; throw new Error('local'); }
}
async function excluirProduto(id) {
  if (store.db) { await semear(); await store.db.doc('produtos/' + id).delete(); return; }
  const antes = produtos;
  produtos = produtos.filter(x => x.id !== id);
  if (!salvarLocal()) { produtos = antes; throw new Error('local'); }
}
async function gravarCfg(novo) {
  if (store.db) { await semear(); await store.db.doc('config/site').set({ ...novo, iniciado: true }); return; }
  const antes = cfg; cfg = { ...novo };
  if (!salvarLocal()) { cfg = antes; throw new Error('local'); }
}

  if (store.db) return 'Não foi possível salvar. Neste ambiente de teste só quem tem permissão de edição consegue salvar.';
  return 'Não foi possível salvar neste navegador. Tente uma foto menor.';
}

/* ===== Quiz ===== */
function pontos(p, a) {
  let s = 0;
  if (p.estilo === a.estilo) s += 4;
  if (p.corCat === a.cor) s += 3;
  if (p.ocasiao === a.ocasiao) s += 2;
  if (p.caimento === a.caimento) s += 1.5;
  if (!temPreco(p)) s += 1.5;
  else if (p.preco <= a.orc) s += 1.5;
  else if (p.preco <= a.orc * 1.2) s += 0.5;
  return s;
}
const MAX_PONTOS = 12;
function calcular(a) {
  const ranking = produtos
    .map(p => ({ p, pct: Math.round(pontos(p, a) / MAX_PONTOS * 100) }))
    .sort((x, y) => y.pct - x.pct || (x.p.preco || 0) - (y.p.preco || 0));
  return { a, ranking, persona: PERSONA[a.estilo], corFrase: COR_FRASE[a.cor] };
}

function renderMidia() { const el = document.getElementById('midia'); if (el) el.innerHTML = midiaHtml(); }
function syncCores() {
  document.querySelectorAll('[data-cor-campo]').forEach(el => {
    const c = admin.cores[Number(el.dataset.ci)];
    if (c) c[el.dataset.corCampo] = el.value;
  });
}
async function addFotos(input, ci) {
  syncCores();
  const alvo = ci === undefined ? admin.fotos : (admin.cores[Number(ci)] || {}).fotos;
  if (!alvo) return;
  const total = () => admin.fotos.length + admin.cores.reduce((n, c) => n + c.fotos.length, 0);
  const files = Array.from(input.files || []);
  input.value = '';
  if (!files.length) return;
  if (total() >= MAX_FOTOS) { aviso('Limite de ' + MAX_FOTOS + ' fotos por produto. Remova alguma para adicionar outra.', true); return; }
  aviso('Enviando fotos…');
  let erro = false, cortou = false;
  for (const f of files) {
    if (total() >= MAX_FOTOS) { cortou = true; break; }
    try { alvo.push(await reduzirFoto(f, 700, 70000, 0.8)); } catch (x) { erro = true; }
  }
  renderMidia();
  if (erro) aviso('Alguma imagem não pôde ser lida. Tente outra foto.', true);
  else if (cortou) aviso('Limite de ' + MAX_FOTOS + ' fotos por produto. As demais foram ignoradas.', true);
}

/* ===== Navegação ===== */
const ROTAS = ['inicio', 'sobre', 'quiz', 'resultado', 'catalogo', 'produto', 'adm'];
let rotaAnterior = null;
const rotaAtual = () => { const r = (location.hash || '#inicio').slice(1); return ROTAS.includes(r) ? r : 'inicio'; };

function rotear() {
  const rota = rotaAtual();
  if (rota === 'resultado' && !state.result) { location.hash = '#quiz'; return; }
  if (rota === 'produto' && !carregando && !prodAtual()) { location.hash = '#catalogo'; return; }
  if (rota === 'quiz' && rotaAnterior !== 'quiz') { state.q = 0; state.resp = {}; }
  if (rota === 'catalogo' && rotaAnterior !== 'catalogo') { if (!state.fixar) state.filtro = null; state.fixar = false; }
  if (rota === 'adm' && rotaAnterior !== 'adm') { admin.edit = null; admin.aba = 'produtos'; admin.confirmar = null; admin.linkFoto = undefined; }
  rotaAnterior = rota;
  document.getElementById('barra').hidden = true; document.body.classList.remove('has-barra');
  if (carregando) return telaCarregando();
  ({ inicio: telaInicio, sobre: telaSobre, quiz: telaQuiz, resultado: telaResultado, catalogo: telaCatalogo, produto: telaProduto, adm: telaAdm })[rota]();
}
window.addEventListener('hashchange', rotear);

/* Atualiza a tela quando os dados mudam, sem apagar o que a pessoa está digitando. */
function refrescar() {
  const rota = rotaAtual();
  if (carregando) return;
  if (rota === 'quiz') return;
  if (rota === 'adm') { if (admin.logado && !admin.edit && admin.aba !== 'sobre' && admin.aba !== 'ajustes' && admin.aba !== 'categorias') telaAdm(true); return; }
  if (rota === 'resultado' && !state.result) return;
  if (rota === 'produto' && !prodAtual()) { location.hash = '#catalogo'; return; }
  ({ inicio: telaInicio, sobre: telaSobre, resultado: telaResultado, catalogo: telaCatalogo, produto: telaProduto })[rota](true);
}

app.addEventListener('click', e => {
  const t = e.target;

  if (pr) { state.prod = pr.dataset.prod; state.cor = -2; state.tam = ''; state.num = ''; return; }

  const sc = t.closest('[data-cor]');
  if (sc && !t.closest('form')) { state.cor = Number(sc.dataset.cor); telaProduto(true); return; }
  const st = t.closest('[data-tam]');
  if (st) {
    state.tam = state.tam === st.dataset.tam ? '' : st.dataset.tam;
    app.querySelectorAll('[data-tam]').forEach(b => { const on = b.dataset.tam === state.tam; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
    const buy = document.getElementById('pd-buy'), p = prodAtual();
    if (buy && p) buy.href = wa(msgCompra(p));
    return;
  }
  const sn = t.closest('[data-num]');
  if (sn) {
    state.num = state.num === sn.dataset.num ? '' : sn.dataset.num;
    app.querySelectorAll('[data-num]').forEach(b => { const on = b.dataset.num === state.num; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
    const buy2 = document.getElementById('pd-buy'), p2 = prodAtual();
    if (buy2 && p2) buy2.href = wa(msgCompra(p2));
    return;
  }
  const th = t.closest('[data-thumb]');
  if (th) { const tr = document.getElementById('gal-track'); if (tr) tr.scrollTo({ left: Number(th.dataset.thumb) * tr.clientWidth, behavior: 'smooth' }); return; }
  const rmf = t.closest('[data-rm-foto]');
  if (rmf) { syncCores(); admin.fotos.splice(Number(rmf.dataset.rmFoto), 1); renderMidia(); return; }
  const rmc = t.closest('[data-rm-cor]');
  if (rmc) { syncCores(); admin.cores.splice(Number(rmc.dataset.rmCor), 1); renderMidia(); return; }
  if (t.closest('[data-add-cor]')) { syncCores(); admin.cores.push({ nome: '', hex: '#1E1E22', fotos: [] }); renderMidia(); const n = document.getElementById('c-nome-' + (admin.cores.length - 1)); if (n) n.focus(); return; }
  const rmcf = t.closest('button.mf-x');
  if (rmcf) {
    const at = Array.from(rmcf.attributes).find(a => a.name.startsWith('data-rm-cfoto-'));
    if (at) { syncCores(); const ci = Number(at.name.slice('data-rm-cfoto-'.length)); if (admin.cores[ci]) admin.cores[ci].fotos.splice(Number(at.value), 1); renderMidia(); return; }
  }
  const dcat = t.closest('[data-del-cat]');
  if (dcat) { admin.confirmar = 'cat-' + dcat.dataset.delCat; telaAdm(true); return; }
  const dcats = t.closest('[data-del-cat-sim]');
  if (dcats) {
    const k = dcats.dataset.delCatSim;
    admin.confirmar = null;
    gravarCfg({ ...cfg, cats: (cfg.cats || []).filter(c => c.k !== k) }).then(() => { aviso('Categoria excluída.'); telaAdm(true); }).catch(err => aviso(msgErroGravar(err), true));
    return;
  }
  const pick = t.closest('[data-pick]');
  if (pick) {
    const q = PERGUNTAS[state.q];
    state.resp[q.chave] = q.opcoes[Number(pick.dataset.pick)].v;
    app.querySelectorAll('.opt').forEach(b => b.classList.toggle('on', b === pick));
    setTimeout(() => {
      if (state.q < PERGUNTAS.length - 1) { state.q += 1; telaQuiz(); }
      else { state.result = calcular(state.resp); state.filtro = null; location.hash = '#resultado'; }
    }, 220);
    return;
  }
  if (t.closest('[data-back]')) {
    if (state.q === 0) location.hash = '#inicio'; else { state.q -= 1; telaQuiz(); }
    return;
  }
  const cl = t.closest('[data-catlink]');
  if (cl) { state.filtro = cl.dataset.catlink; state.fixar = true; return; }
  const f = t.closest('[data-filtro]');
  if (f) { state.filtro = f.dataset.filtro; telaCatalogo(true); return; }
  if (t.closest('[data-meu]')) { state.filtro = 'voce'; state.fixar = true; return; }

  /* ADM */

  if (t.closest('[data-cancelar]')) { admin.edit = null; admin.foto = ''; admin.fotos = []; admin.cores = []; admin.tams = []; admin.nums = []; admin.linkFoto = undefined; telaAdm(true); window.scrollTo(0, 0); return; }
  if (t.closest('[data-novo-prod]')) { admin.edit = { tipo: 'produto', id: null }; admin.foto = ''; admin.fotos = []; admin.cores = []; admin.tams = []; admin.nums = []; telaAdm(); return; }
  const ep = t.closest('[data-edit-prod]');
  if (ep) { const p = produtos.find(x => x.id === ep.dataset.editProd); admin.edit = { tipo: 'produto', id: ep.dataset.editProd }; admin.foto = p ? fotoOk(p.foto) : ''; admin.fotos = p ? fotosGerais(p).slice() : []; admin.cores = p ? coresProd(p).map(c => ({ nome: c.nome, hex: c.hex, fotos: (c.fotos || []).filter(fotoOk) })) : []; admin.tams = p ? (p.tamanhos || []).slice() : []; admin.nums = p ? (p.numeros || []).slice() : []; telaAdm(); return; }
  const dp = t.closest('[data-del-prod]');
  if (dp) { admin.confirmar = dp.dataset.delProd; telaAdm(true); return; }
  if (t.closest('[data-del-nao]')) { admin.confirmar = null; telaAdm(true); return; }
  const ds = t.closest('[data-del-sim]');
  if (ds) {
    excluirProduto(ds.dataset.delSim).then(() => { admin.confirmar = null; aviso('Produto excluído.'); telaAdm(true); })
      .catch(err => aviso(msgErroGravar(err), true));
    return;
  }
  if (t.closest('[data-tirar-foto]')) {
    admin.foto = '';
    const prev = document.getElementById('foto-prev'); if (prev) prev.textContent = 'Sem foto';
    const inp = document.getElementById('f-foto'); if (inp) inp.value = '';
    return;
  }
  if (t.closest('[data-tirar-linkfoto]')) {
    admin.linkFoto = '';
    const prev = document.getElementById('link-prev'); if (prev) prev.textContent = 'Sem foto';
    const inp = document.getElementById('l-foto'); if (inp) inp.value = '';
    return;
  }
  const rf = t.closest('[data-foto-reset]');
  if (rf) {
    const tipo = rf.dataset.fotoReset, fid = rf.dataset.fotoId;
    const feito = () => { aviso('Foto original restaurada.'); telaAdm(true); };
    if (tipo === 'slot') {
      gravarFotoDoc(fid, null)
        .then(() => (fid === 'hero' && cfg.heroFoto) ? gravarCfg({ ...cfg, heroFoto: '' }) : null)
        .then(feito).catch(err => aviso(msgErroGravar(err), true));
    } else if (tipo === 'link') gravarFotoDoc('link-' + fid, null).then(feito).catch(err => aviso(msgErroGravar(err), true));
    else { const p = produtos.find(x => x.id === fid); if (p) gravarProduto({ ...p, foto: '' }).then(feito).catch(err => aviso(msgErroGravar(err), true)); }
    return;
  }
  if (t.closest('[data-restaurar-sobre]')) {
    SOBRE_CAMPOS.forEach(c => { const el = document.getElementById('s-' + c.k); if (el) el.value = DEFAULT_SOBRE[c.k]; });
    aviso('Textos originais carregados. Toque em salvar para aplicar.');
    return;

  if (t.closest('[data-novo-link]')) { admin.edit = { tipo: 'link', id: null }; admin.linkFoto = undefined; telaAdm(); return; }
  const el = t.closest('[data-edit-link]');

  const dl = t.closest('[data-del-link]');
  if (dl) { admin.confirmar = dl.dataset.delLink; telaAdm(true); return; }
  const dls = t.closest('[data-del-link-sim]');
  if (dls) {
    gravarFotoDoc('link-' + dls.dataset.delLinkSim, null).catch(() => {});
    const novo = { ...cfg, links: (cfg.links || []).filter(l => l.id !== dls.dataset.delLinkSim) };
    gravarCfg(novo).then(() => { admin.confirmar = null; aviso('Link excluído.'); telaAdm(true); })
      .catch(err => aviso(msgErroGravar(err), true));
  }
});

app.addEventListener('change', async e => {
  const nm = e.target.name;
  if (nm === 'f-tam') admin.tams = TAMS.filter(t => Array.from(document.querySelectorAll('input[name="f-tam"]:checked')).some(x => x.value === t));
  if (nm === 'f-num') admin.nums = NUMS.filter(n => Array.from(document.querySelectorAll('input[name="f-num"]:checked')).some(x => x.value === n));
  const id = e.target.id;
  const cf = e.target.dataset && e.target.dataset.corFotos;
  if (id === 'f-fotos' || cf !== undefined) { await addFotos(e.target, cf); return; }
  const ft = e.target.dataset && e.target.dataset.fotoTipo;
  if (!ft && id !== 'f-foto' && id !== 'l-foto') return;
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  if (ft) {
    const fid = e.target.dataset.fotoId;
    try {
      aviso('Enviando foto…');
      if (ft === 'slot') { const s = SLOTS.find(x => x.k === fid); await gravarFotoDoc(fid, await reduzirFoto(file, s.max, s.lim, razao(s.ar))); }
      else if (ft === 'link') await gravarFotoDoc('link-' + fid, await reduzirFoto(file, 900, 80000, 3));
      else { const p = produtos.find(x => x.id === fid); if (p) { const nova = await reduzirFoto(file, 800, 120000, 0.8); await gravarProduto({ ...p, foto: nova, fotos: [nova, ...fotosGerais(p).slice(1)] }); } }
      aviso('Foto trocada.'); telaAdm(true);
    } catch (x) { aviso(x && x.message === 'imagem' ? 'Não foi possível ler essa imagem. Tente outra foto.' : msgErroGravar(x), true); }
    return;
  }
  try {
    if (id === 'l-foto') {
      admin.linkFoto = await reduzirFoto(file, 900, 80000, 3);
      const prev = document.getElementById('link-prev');
      if (prev) prev.innerHTML = `<img src="${admin.linkFoto}" alt="Foto do card">`;
    } else {
      admin.foto = await reduzirFoto(file, 800, 150000, 0.8);
      const prev = document.getElementById('foto-prev');
      if (prev) prev.innerHTML = `<img src="${admin.foto}" alt="Foto do produto">`;
    }
  } catch (x) { aviso('Não foi possível ler essa imagem. Tente outra foto.', true); }
});

app.addEventListener('submit', async e => {
  e.preventDefault();
  const id = e.target.id;
  const val = k => (document.getElementById(k) || {}).value || '';

  if (id === 'form-login') {
    const erro = document.getElementById('login-erro');
    try {
      const h = await sha(val('adm-senha'));
      if (h === (cfg.senhaHash || SENHA_PADRAO_HASH)) {
        admin.logado = true;
        try { sessionStorage.setItem('bella-adm', '1'); } catch (x) {}
        telaAdm();
      } else { erro.textContent = 'Senha incorreta. Tente de novo.'; erro.hidden = false; }
    } catch (x) { erro.textContent = 'Não foi possível verificar a senha neste navegador.'; erro.hidden = false; }
    return;
  }

  if (id === 'form-cat') {
    const erro = document.getElementById('cat-erro');
    const nome = val('c-nome').trim().replace(/\s+/g, ' ');
    const norm = x => x.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    if (!nome) return;
    const existentes = Object.values(filtrosAll()).concat(Object.values(tiposAll()));
    if (existentes.some(x => norm(x) === norm(nome))) { erro.textContent = 'Já existe uma categoria com esse nome.'; erro.hidden = false; return; }
    erro.hidden = true;
    let k = norm(nome).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'cat';
    const usadas = Object.keys(filtrosAll()).concat(['voce', 'todos']);
    let n = 2, base = k;
    while (usadas.includes(k)) { k = base + '-' + n++; }
    try {
      await gravarCfg({ ...cfg, cats: (cfg.cats || []).concat([{ k, nome }]) });
      aviso('Categoria adicionada.'); telaAdm(true);
    } catch (err) { aviso(msgErroGravar(err), true); }
    return;
  }

  if (id === 'form-prod') {
    const nome = val('f-nome').trim();
    if (!nome) return;
    const bruto = val('f-preco').trim();
    const preco = bruto === '' ? null : Math.max(0, Number(bruto.replace(',', '.')));
    const existente = admin.edit.id ? produtos.find(x => x.id === admin.edit.id) : null;
    const maxOrdem = produtos.reduce((m, x) => Math.max(m, x.ordem || 0), 0);
    const p = {
      id: existente ? existente.id : 'p' + Date.now().toString(36),
      ordem: existente ? existente.ordem : maxOrdem + 1,
      nome, desc: val('f-desc').trim(), preco: isFinite(preco) ? preco : null,
      tipo: val('f-tipo'), cor: corOk(val('f-cor')), corNome: val('f-cornome').trim() || 'Cor única',
      corCat: val('f-corcat'), estilo: val('f-estilo'), ocasiao: val('f-ocasiao'), caimento: val('f-caimento'),
      fotos: admin.fotos.filter(fotoOk), foto: admin.fotos.filter(fotoOk)[0] || '',
      cores: (syncCores(), admin.cores.map(c => ({ nome: String(c.nome || '').trim(), hex: corOk(c.hex), fotos: c.fotos.filter(fotoOk) })).filter(c => c.nome)),
      tamanhos: TAMS.filter(t => Array.from(document.querySelectorAll('input[name="f-tam"]:checked')).some(x => x.value === t)),
      numeros: NUMS.filter(n => Array.from(document.querySelectorAll('input[name="f-num"]:checked')).some(x => x.value === n))
    };
    const btn = document.getElementById('salvar-prod');
    btn.disabled = true; btn.textContent = 'Salvando…';
    try {
      await gravarProduto(p);
      admin.edit = null; admin.foto = '';
      aviso('Produto salvo.');
      telaAdm();
    } catch (err) {
      btn.disabled = false; btn.textContent = 'Salvar produto';
      aviso(msgErroGravar(err), true);
    }
    return;
  }

  if (id === 'form-link') {
    let url = val('l-url').trim();
    if (url && !/^[a-z]+:\/\//i.test(url)) url = 'https://' + url;
    if (!urlOk(url)) { document.getElementById('link-erro').hidden = false; return; }
    const ls = (cfg.links || []).slice();
    const novo = { id: admin.edit.id || 'l' + Date.now().toString(36), titulo: val('l-titulo').trim(), sub: val('l-sub').trim(), url };
    const i = ls.findIndex(x => x.id === novo.id);
    if (i >= 0) ls[i] = novo; else ls.push(novo);
    try {
      if (admin.linkFoto !== undefined) await gravarFotoDoc('link-' + novo.id, admin.linkFoto || null);
      await gravarCfg({ ...cfg, links: ls });
      admin.edit = null; admin.linkFoto = undefined; aviso('Link salvo.'); telaAdm();
    } catch (err) { aviso(msgErroGravar(err), true); }
    return;
  }

  if (id === 'form-sobre') {
    const novo = {};
    SOBRE_CAMPOS.forEach(c => { novo[c.k] = val('s-' + c.k).trim(); });
    try {
      await gravarCfg({ ...cfg, sobre: novo });
      aviso('Página Sobre salva.');
    } catch (err) { aviso(msgErroGravar(err), true); }
    return;
  }

  if (id === 'form-ajustes') {
    const erro = document.getElementById('aj-erro');
    let d = soDigitos(val('a-whats'));
    if (d.length < 10) { erro.textContent = 'Digite o WhatsApp com DDD, por exemplo (11) 99999-9999.'; erro.hidden = false; return; }
    if (d.length <= 11) d = '55' + d;
    erro.hidden = true;
    let arroba = val('a-arroba').trim();
    if (arroba && !arroba.startsWith('@')) arroba = '@' + arroba;
    let mapaUrl = val('a-mapa').trim();
    if (mapaUrl && !urlOk(mapaUrl)) { erro.textContent = 'O link do mapa precisa começar com https://'; erro.hidden = false; return; }
    try {
      await gravarCfg({
        ...cfg, marca: val('a-marca').trim() || cfg.marca, segmento: val('a-seg').trim(), frase: val('a-frase').trim(),
        arroba, whatsapp: d, whatsappExibir: fmtTel(d), endereco: val('a-end').trim(), mapaUrl
      });
      aviso('Ajustes salvos.'); telaAdm();
    } catch (err) { aviso(msgErroGravar(err), true); }
    return;
  }

  if (id === 'form-senha') {
    const erro = document.getElementById('senha-erro');
    const a = val('s-nova'), b = val('s-rep');
    if (a.length < 6) { erro.textContent = 'A senha precisa ter pelo menos 6 caracteres.'; erro.hidden = false; return; }
    if (a !== b) { erro.textContent = 'As duas senhas não são iguais.'; erro.hidden = false; return; }
    erro.hidden = true;
    try {
      await gravarCfg({ ...cfg, senhaHash: await sha(a) });
      aviso('Senha trocada.'); telaAdm();
    } catch (err) { aviso(msgErroGravar(err), true); }
  }
});

rotear();
iniciarArmazenamento();
</script>

</body></html>
